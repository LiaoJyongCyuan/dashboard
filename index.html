<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日儀表板</title>
<style>
  :root {
    --text: #2C2C2B;
    --text2: #7D7A75;
    --seg-empty: #F0EFED;
    --dot-ring: rgba(0,0,0,0.18);
    --sea-sp: #7FBE8B; --sea-su: #E5A898; --sea-au: #E0BE8A; --sea-wi: #82A8DB; --sea-hand: #C2552A;
    --sun-day: #EBB670;
    --sun-night: #96A8C9;
    --mkt-closed: #EDEDEB;
    --sun-hand: #D5754A; /* 白天指針：比主題橘再沉穩一點 */
    --sun-hand-night: #57649E; /* 夜間指針：靛藍再淡一階，仍暗於夜弧 #96A8C9 */
    --dot-blue: #A9CDEC;
    --dot-green: #A8D3B8;
    --dot-amber: #E9CF95;
    --dot-lav: #C9B8E4;
    --dot-rose: #E9BCC8;
    --dot-teal: #A8D3D1;
    --seg-fill-a: #BFD9F2;
    --seg-fill-b: #8FBBE8;
    --chip-bg: #EAF3FB;
    --chip-text: #5B8FC7;
    /* 星期燈：平日柿橘、週末灰玫瑰，亮燈皆實心白字、同尺寸 */
    --wd-on: #E8683C;
    --wd-on-wknd: #D37790;
    --wd-off-bg: #FCEFE5;
    --wd-off-text: #C68C66;
    --wd-off-bg-wknd: #FAEFF2;
    --wd-off-text-wknd: #D194A3;
    /* 休息日色（2026/10 改版，取代灰玫瑰）：週日＋國定假日＋補假＝珊瑚紅、週六＝鼠尾草綠；行程標記＝霧青 */
    --rest-sun: #ED6B5A;
    --rest-sun-bg: #FCEBE7;
    --ev-rgb: 236, 178, 72;   /* 行程底色（琥珀，與農曆膠囊同色系），透明度依筆數疊加 */
    --cal-out: #ABA8A2;       /* 月曆：其他月份的日期 */
    --nd-dot: #D3D0CA;        /* 切換圓點 */
    --nd-arrow: #7D7A75;      /* 切換圓點滑過時的箭頭 */
    --ag-ad-text: #9A6A1E;    /* 行程欄「全天」標籤字色 */
    /* 年度天數標籤：扁平內斂 */
    --doy-text: #8C8983;
    /* 分區細線 */
    --divider: rgba(0,0,0,0.12);
  }
  :root[data-theme="green"] {
    --seg-fill-a: #C2E0CE;
    --seg-fill-b: #85C29F;
    --chip-bg: #E9F4EE;
    --chip-text: #4F9C74;
  }
  :root[data-theme="amber"] {
    --seg-fill-a: #F0DFB6;
    --seg-fill-b: #DFBE72;
    --chip-bg: #FAF2DF;
    --chip-text: #A98938;
  }
  :root[data-theme="lav"] {
    --seg-fill-a: #DCD2EE;
    --seg-fill-b: #B29BDC;
    --chip-bg: #F2EEFA;
    --chip-text: #8A6FC0;
  }
  :root[data-theme="rose"] {
    --seg-fill-a: #F1D3DB;
    --seg-fill-b: #DFA0B2;
    --chip-bg: #FAEFF2;
    --chip-text: #BC7089;
  }
  :root[data-theme="teal"] {
    --seg-fill-a: #C5E3E1;
    --seg-fill-b: #82C6C3;
    --chip-bg: #E9F5F4;
    --chip-text: #4E9C99;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #FFFFFF;
      --text2: rgba(255,255,255,0.65);
      --seg-empty: rgba(255,255,255,0.13);
      --dot-ring: rgba(255,255,255,0.35);
      --sea-sp: #6C9A77; --sea-su: #906860; --sea-au: #867150; --sea-wi: #5D80A8; --sea-hand: #F0925C;
      --sun-day: rgba(236,175,110,0.78);
      --sun-night: rgba(135,158,205,0.7);
      --mkt-closed: rgba(170,170,170,0.2);
      --sun-hand: #D9814F; /* 白天指針（深色模式）：稍降亮度 */
      --sun-hand-night: #8194DF; /* 夜間指針（深色模式）：靛藍再淡一階 */
      --seg-fill-a: rgba(94,159,232,0.45);
      --seg-fill-b: rgba(94,159,232,0.85);
      --chip-bg: rgba(94,159,232,0.14);
      --chip-text: #8FB8E8;
      --wd-on: #E97C4E;
      --wd-on-wknd: #D17B92;
      --wd-off-bg: rgba(233,124,78,0.14);
      --wd-off-text: rgba(238,158,120,0.78);
      --wd-off-bg-wknd: rgba(228,150,173,0.14);
      --wd-off-text-wknd: rgba(238,175,193,0.8);
      --doy-text: rgba(255,255,255,0.62);
      --divider: rgba(255,255,255,0.18);
      --rest-sun: #EF7A6A;
      --rest-sun-bg: rgba(237,107,90,0.16);
      --ev-rgb: 230, 176, 80;
      --cal-out: rgba(255,255,255,0.34);
      --nd-dot: rgba(255,255,255,0.26);
      --nd-arrow: rgba(255,255,255,0.78);
      --ag-ad-text: #EBC27A;
    }
    :root[data-theme="green"] {
      --seg-fill-a: rgba(114,188,143,0.45);
      --seg-fill-b: rgba(114,188,143,0.85);
      --chip-bg: rgba(114,188,143,0.14);
      --chip-text: #93CDA9;
    }
    :root[data-theme="amber"] {
      --seg-fill-a: rgba(224,190,114,0.45);
      --seg-fill-b: rgba(224,190,114,0.85);
      --chip-bg: rgba(224,190,114,0.14);
      --chip-text: #DCC183;
    }
    :root[data-theme="lav"] {
      --seg-fill-a: rgba(178,155,220,0.45);
      --seg-fill-b: rgba(178,155,220,0.85);
      --chip-bg: rgba(178,155,220,0.14);
      --chip-text: #C3B0E4;
    }
    :root[data-theme="rose"] {
      --seg-fill-a: rgba(223,160,178,0.45);
      --seg-fill-b: rgba(223,160,178,0.85);
      --chip-bg: rgba(223,160,178,0.14);
      --chip-text: #E4B3C1;
    }
    :root[data-theme="teal"] {
      --seg-fill-a: rgba(130,198,195,0.45);
      --seg-fill-b: rgba(130,198,195,0.85);
      --chip-bg: rgba(130,198,195,0.14);
      --chip-text: #9AD0CD;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 24px;
  }
  /* 版面：左欄＝主資訊（上）＋新聞列（下，右端止於時間區塊下方）；右欄＝月曆、主題色點，跨兩列 */
  .wrap {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto auto auto;
    column-gap: 12px;
    align-items: center;
  }
  .main {
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
  }
  /* ---- top line: date + day ring + time ---- */
  .line {
    display: flex;
    align-items: baseline;
    gap: 9px;
    flex-wrap: wrap;
  }
  .date {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  /* 星期標籤：與「第 N 天」同家族，平日柿橘、週末灰玫瑰 */
  .wd-chip {
    background: var(--wd-off-bg);
    color: var(--wd-on);
    border-radius: 4px;
    padding: 0 5px;
    line-height: 15px;
    font-size: 10.5px;
    font-weight: 500;
    align-self: center;
    white-space: nowrap;
  }
  .wd-chip.sun {
    background: var(--rest-sun-bg);
    color: var(--rest-sun);
  }
  .wd-chip.sat {
    background: var(--rest-sun-bg);
    color: var(--rest-sun);
  }
  body.ready .wd-chip { transition: background 0.3s ease, color 0.3s ease; }
  /* ---- 分區細線：左欄與月曆之間（縱貫兩列） ---- */
  .vdiv {
    grid-column: 2;
    grid-row: 1 / span 2;
    align-self: stretch;
    width: 1px;
    margin: 6px 0;
    border-radius: 0.5px;
    background: var(--divider);
  }
  /* ---- 月曆（整月六週、可切換月份；滑過日期看農曆／節日／行程，點一下開 Google 日曆） ---- */
  .mcal {
    grid-column: 3;
    grid-row: 1 / span 2;
    align-self: stretch;
    display: flex;
    gap: 7px;
    min-height: 76px;
  }
  .mc-side {
    flex: 0 0 auto;
    width: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 1px 0;
    user-select: none;
  }
  .mc-yr {
    font-size: 9px;
    font-weight: 600;
    line-height: 10px;
    color: var(--text2);
    font-variant-numeric: tabular-nums;
  }
  .mc-mon {
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    color: var(--text);
    font: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }
  .mc-mon b {
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .mc-mon i {
    font-style: normal;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text2);
    margin-top: 1px;
  }
  .mcal.away .mc-mon b { color: var(--chip-text); } /* 瀏覽其他月份時，月份數字改主題色提示 */
  /* 切換鈕：兩顆同尺寸灰點（左＝上一個、右＝下一個），滑過時灰點收起、露出方向箭頭 */
  .navdots { display: inline-flex; align-items: center; gap: 1px; flex: none; }
  .nd { position: relative; flex: none; width: 13px; height: 13px; padding: 0; border: 0; background: none; cursor: pointer; }
  .nd::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: var(--nd-dot);
    transition: transform 0.18s ease, opacity 0.18s ease;
  }
  .nd::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 4px; height: 4px;
    border-top: 1.5px solid var(--nd-arrow); border-right: 1.5px solid var(--nd-arrow);
    opacity: 0; transition: opacity 0.18s ease;
  }
  .nd.prev::after { transform: translate(-30%, -50%) rotate(-135deg); }
  .nd.next::after { transform: translate(-75%, -50%) rotate(45deg); }
  .nd:hover::before, .nd:focus-visible::before { transform: scale(0.2); opacity: 0; }
  .nd:hover::after, .nd:focus-visible::after { opacity: 1; }
  .nd:active::after { border-color: var(--text); }
  .nd:focus-visible { outline: none; }
  .mc-nav { gap: 0; }
  .mc-grid {
    display: grid;
    grid-template-columns: repeat(7, 18px);
    grid-template-rows: auto repeat(6, minmax(0, 1fr));
    column-gap: 2px;
    row-gap: 1px;
    align-items: stretch;
  }
  .mc-h {
    font-size: 9px;
    font-weight: 600;
    line-height: 1;
    padding-bottom: 2px;
    text-align: center;
    color: var(--text2);
    user-select: none;
  }
  .mc-h.rest { color: var(--rest-sun); }
  .mc-d {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 10px;
    border-radius: 4px;
    font-size: 9.5px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease;
  }
  .mc-d:hover { background: var(--seg-empty); }
  .mc-d:focus-visible { outline: none; box-shadow: 0 0 0 1px var(--text2); }
  .mc-d.rest { color: var(--rest-sun); }              /* 週六日、國定假日：統一珊瑚橘 */
  .mc-d.out, .mc-d.out.rest { color: var(--cal-out); } /* 其他月份：一律灰，不分平日假日 */
  /* 有行程：琥珀透明底，筆數越多疊得越深（--ea 由程式依筆數設定） */
  .mc-d.ev { background: rgba(var(--ev-rgb), var(--ea, 0.2)); }
  .mc-d.ev:hover { background: rgba(var(--ev-rgb), calc(var(--ea, 0.2) + 0.12)); }
  .mc-d.today, .mc-d.today.ev { background: var(--wd-on); color: #FFFFFF; }
  .mc-d.today.rest, .mc-d.today.rest.ev { background: var(--rest-sun); }
  /* ---- 今天／明天行程欄（月曆右側） ---- */
  .agenda {
    grid-column: 4;
    grid-row: 1 / span 2;
    align-self: center;
    width: 168px;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    grid-auto-rows: 15px;
    column-gap: 8px;
    font-size: 11px;
    line-height: 15px;
  }
  .agenda[hidden] { display: none; }
  .wrap:has(.agenda[hidden]) { grid-template-columns: minmax(0, 1fr) auto auto auto; }
  .wrap:has(.agenda[hidden]) .dots { grid-column: 4; }
  .ag-lab { grid-column: 1; font-size: 10.5px; font-weight: 600; color: var(--text2); white-space: nowrap; }
  .ag-lab.td { color: var(--chip-text); }
  .ag-it, .ag-none, .ag-more { grid-column: 2; min-width: 0; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .ag-tm { flex: none; font-size: 10px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .ag-tm.ad { font-size: 9px; line-height: 13px; padding: 0 4px; border-radius: 3px; background: rgba(var(--ev-rgb), 0.3); color: var(--ag-ad-text); }
  .ag-ti { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .ag-it.past { opacity: 0.38; }
  .ag-it.now .ag-tm { color: var(--wd-on); font-weight: 650; }
  .ag-none, .ag-more { color: var(--text2); opacity: 0.75; font-size: 10.5px; }
  .agenda .gap { margin-top: 4px; } /* 今天與明天之間留一點呼吸 */
  .doy-chip.s-spring { background: rgba(120,180,130,0.18); color: #55875B; }
  .doy-chip.s-summer { background: rgba(226,132,110,0.18); color: #C2604F; }
  .doy-chip.s-autumn { background: rgba(226,178,96,0.2); color: #A9702B; }
  .doy-chip.s-winter { background: rgba(120,155,215,0.18); color: #5578A9; }
  .doy-chip.term { background: #F7E7CB; color: #A9702B; }
  .doy-chip {
    background: var(--seg-empty);
    color: var(--doy-text);
    border-radius: 4px;
    padding: 0 5px;
    line-height: 15px;
    font-size: 10.5px;
    font-weight: 500;
    align-self: center;
    white-space: nowrap;
  }
  /* ---- 天氣膠囊：與「第 N 天」同家族 ---- */
  .wx-chip {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: var(--chip-bg);
    border-radius: 4px;
    padding: 0 6px;
    line-height: 15px;
    font-size: 10.5px;
    font-weight: 500;
    align-self: center;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .wx-chip[hidden] { display: none; }
  #wx { cursor: pointer; }

  .etf-tris { display: inline-flex; align-items: center; gap: 2px; font-size: 8px; line-height: 15px; }
  .etf-tris[hidden] { display: none; }
  /* 階層色以台股指數漲跌色為基準（第2階＝#C1867D／#7FA98E 本色），向淺深兩端拉開 */
  .etf-tris .t-u1, #twChg.t-u1 { color: #DCB3AC; }
  .etf-tris .t-u2, #twChg.t-u2 { color: #C1867D; }
  .etf-tris .t-u3, #twChg.t-u3 { color: #A2584E; }
  .etf-tris .t-u4, #twChg.t-u4 { color: #7E2E24; }
  .etf-tris .t-d1, #twChg.t-d1 { color: #ABC8B6; }
  .etf-tris .t-d2, #twChg.t-d2 { color: #7FA98E; }
  .etf-tris .t-d3, #twChg.t-d3 { color: #578466; }
  .etf-tris .t-d4, #twChg.t-d4 { color: #305C41; }
  .etf-tris .t-f, #twChg.t-f { color: #B9B4AC; }
  #twChg { font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    /* 深色模式以「灰淡→鮮濃」表現深淺：幅度越大色彩越濃越醒目 */
    .etf-tris .t-u1, #twChg.t-u1 { color: #8F6D67; }
    .etf-tris .t-u2, #twChg.t-u2 { color: #B4867D; }
    .etf-tris .t-u3, #twChg.t-u3 { color: #D8A093; }
    .etf-tris .t-u4, #twChg.t-u4 { color: #F8BCA9; }
    .etf-tris .t-d1, #twChg.t-d1 { color: #6E8B7A; }
    .etf-tris .t-d2, #twChg.t-d2 { color: #8BAE97; }
    .etf-tris .t-d3, #twChg.t-d3 { color: #A8D2B6; }
    .etf-tris .t-d4, #twChg.t-d4 { color: #C5F5D5; }
    .etf-tris .t-f, #twChg.t-f { color: #6E6961; }
  }
  .wx-ic {
    font-size: 11px;
    line-height: 15px;
  }
  .wx-t { font-weight: 600; }
  .wx-item {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .wx-up { color: #C1867D; font-weight: 600; }
  .wx-down { color: #7FA98E; font-weight: 600; }
  .wx-flat { color: var(--text2); font-weight: 600; }
  .wx-lab { color: var(--text2); font-weight: 500; }
  #wx { cursor: pointer; }
  .moon-ic { font-size: 12px; line-height: 15px; align-self: center; user-select: none; }
  #tw.mkt-closed { background: var(--mkt-closed); }
  #tw.mkt-open-up { background: #F6E8E4; }
  #tw.mkt-open-down { background: #E7F0EA; }
  .wx-aqi-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9AA0A6;
    flex: 0 0 auto;
  }
  .time-group {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    align-self: center;
  }
  .dayring {
    display: block;
    transform: rotate(-90deg);
  }
  .ring-base {
    fill: var(--chip-bg);
  }
  .ring-fill {
    fill: none;
    stroke: var(--seg-fill-b);
    stroke-width: 9;
  }
  body.ready .ring-fill { transition: stroke-dasharray 0.8s ease; }
  /* 日照時鐘：自訂角度（正午在上、午夜在下），不套用 -90deg 旋轉 */
  #sunring { transform: none; }
  #sunDayArc { fill: none; stroke: var(--sun-day); stroke-width: 5.8; }
  #sunNightArc { fill: none; stroke: var(--sun-night); stroke-width: 5.8; }
  #sunHand { fill: var(--sun-hand); }
  #sunring.night #sunHand { fill: var(--sun-hand-night); }
  /* 四季輪：一年一圈，四色＝天文四季 */
  .sea-spring { fill: none; stroke: var(--sea-sp); stroke-width: 5.8; }
  .sea-summer { fill: none; stroke: var(--sea-su); stroke-width: 5.8; }
  .sea-autumn { fill: none; stroke: var(--sea-au); stroke-width: 5.8; }
  .sea-winter { fill: none; stroke: var(--sea-wi); stroke-width: 5.8; }
  #seasonHand { fill: var(--sea-hand); }
  .time {
    font-size: 21px;
    font-weight: 650;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .time .sec {
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    font-variant-numeric: tabular-nums;
  }
  /* ---- segmented year progress ---- */
  .bar-row {
    margin-top: 9px;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .bar-label {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--text2);
    white-space: nowrap;
  }
  .segments {
    flex: 1 1 auto;
    display: flex;
    gap: 3px;
    height: 6px;
  }
  .seg {
    flex: 1 1 0;
    background: var(--seg-empty);
    border-radius: 3px;
    overflow: hidden;
  }
  .seg-inner {
    display: block;
    height: 100%;

    // 行數分配：明天至少 1 行（最多先留 2 行），其餘給今天；今天放不下時優先省略已結束的
    var mNeed = Math.min(Math.max(days[1].list.length, 1), 2);
    var tCap = Math.max(1, AG_LINES - mNeed);
    var tUsed = Math.min(Math.max(days[0].list.length, 1), tCap);
    var caps = [tUsed, AG_LINES - tUsed];
    days.forEach(function (day, di) {
      var list = day.list, cap = caps[di];
      tip.push(day.lab + "（" + (addDays(now, di).getMonth() + 1) + "/" + addDays(now, di).getDate() + "）");
      if (!list.length) tip.push("・沒有行程");
      list.forEach(function (e) { tip.push(evLine(e, multi)); });
      if (di === 0) tip.push("");
      var show = list, moreLine = false;
      if (list.length > cap) {
        if (day.today) { // 放不下時，先省略已結束的（滑過行程欄仍可看到完整清單）
          var live = list.filter(function (e) { return e.ad || e.em > nowMin; });
          if (live.length) show = live;
        }
        var base = show; // 「＋N 項」只算還沒結束、被省略的
        if (show.length > cap) { show = show.slice(0, cap - 1); moreLine = true; }
      }
      var more = moreLine ? base.length - show.length : 0;
      var rows = Math.max(show.length + (moreLine ? 1 : 0), 1);
      var lab = agEl_("span", "ag-lab " + day.cls + (di ? " gap" : ""), day.lab);
      lab.style.gridRow = "span " + rows;
      frag.appendChild(lab);
      if (!list.length) frag.appendChild(agEl_("span", "ag-none" + (di ? " gap" : ""), "沒有行程"));
      show.forEach(function (e, j) {
        var past = day.today && !e.ad && e.em <= nowMin;
        var live = day.today && !e.ad && e.sm <= nowMin && nowMin < e.em;
        var row = agEl_("span", "ag-it" + (past ? " past" : "") + (live ? " now" : "") + (di && !j ? " gap" : ""));
        var tm = e.ad ? "全天" : e.text[0].replace(/–.*$/, "");
        row.appendChild(agEl_("span", "ag-tm" + (e.ad ? " ad" : ""), tm));
        row.appendChild(agEl_("span", "ag-ti", e.text[1]));
        frag.appendChild(row);
      });
      if (moreLine) frag.appendChild(agEl_("span", "ag-more" + (di && !show.length ? " gap" : ""), "＋" + more + " 項"));
    });
    agEl.innerHTML = "";
    agEl.appendChild(frag);
    agEl.title = tip.join("\n");
  }
  // ---- 行程資料：localStorage 快取 10 分鐘＋背景更新；同一區間同時只發一個請求 ----
  function applyCalEvents(key, events, failed) {
    var r = buildCalIndex(events || []);
    if (key === calEvKey) {
      calEv = r.map; calEvMulti = r.multi; calEvFailed = failed || []; calEvState = "ok";
      renderCal();
    }
    if (key === calHomeKey()) { r.key = key; calHome = r; calHomeState = "ok"; renderAgenda(); }
  }
  function calLoad(y, m, force) {
    if (!CAL_KEY || !WORKER_URL) return;
    var key = calRangeKey(y, m), parts = key.split("_");
    var store = null;
    try { store = JSON.parse(localStorage.getItem("calev1") || "null"); } catch (e) {}
    if (!store || typeof store !== "object") store = {};
    // 本機快取 10 分鐘：儀表板每次切頁都會重載，避免一直打 Apps Script
    if (!force && store[key] && Date.now() - store[key].t < 10 * 60 * 1000) { applyCalEvents(key, store[key].ev, store[key].f); return; }
    if (store[key]) applyCalEvents(key, store[key].ev, store[key].f); // 先顯示舊資料，背景更新
    if (calInflight[key] && !force) return;
    calInflight[key] = 1;
    fetch(WORKER_URL + "/cal?start=" + parts[0] + "&end=" + parts[1] + (force ? "&fresh=1" : ""), { headers: { "X-Cal-Key": CAL_KEY } })
      .then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      })
      .then(function (j) {
        delete calInflight[key];
        if (!j || Object.prototype.toString.call(j.events) !== "[object Array]") throw new Error("bad data");
        var st2 = null;
        try { st2 = JSON.parse(localStorage.getItem("calev1") || "null"); } catch (e) {}
        if (!st2 || typeof st2 !== "object") st2 = {};
        st2[key] = { t: Date.now(), ev: j.events, f: j.failed || [] };
        var keys = Object.keys(st2).sort(function (a, b) { return st2[b].t - st2[a].t; });
        for (var i = 4; i < keys.length; i++) delete st2[keys[i]]; // 只留最近 4 個月份
        try { localStorage.setItem("calev1", JSON.stringify(st2)); } catch (e) {}
        applyCalEvents(key, j.events, j.failed);
      })
      .catch(function () {
        delete calInflight[key];
        if (store[key]) return; // 有舊資料就繼續顯示舊的
        if (key === calEvKey && calEvState !== "ok") { calEvState = "err"; renderCal(); }
        if (key === calHomeKey() && !calHome) { calHomeState = "err"; renderAgenda(); }
      });
  }
  function loadCalEvents(force) {
    if (!CAL_KEY || !WORKER_URL) { calEvState = "off"; return; }
    calEvKey = calRangeKey(calView.y, calView.m);
    if (calEvState !== "ok" || !Object.keys(calEv).length) { calEvState = "loading"; }
    calLoad(calView.y, calView.m, force);
    if (calEvState === "loading") renderCal();
    var n = new Date();
    if (calRangeKey(n.getFullYear(), n.getMonth()) !== calEvKey) calLoad(n.getFullYear(), n.getMonth(), false); // 今天／明天欄
  }
  function calGo(delta) {
    var now = new Date();
    var d = delta === 0 ? new Date(now.getFullYear(), now.getMonth(), 1) : new Date(calView.y, calView.m + delta, 1);
    calView = { y: d.getFullYear(), m: d.getMonth() };
    calEv = {}; calEvState = "loading"; // 換月先清掉舊索引，等新資料進來
    renderCal();
    loadCalEvents(false);
  }
  function calOnNewDay() {
    if (!calInited) return;
    var now = new Date();
    calLunarMemo = {};
    if (calFollow) {
      var moved = calView.y !== now.getFullYear() || calView.m !== now.getMonth();
      calView = { y: now.getFullYear(), m: now.getMonth() };
      if (moved) { calEv = {}; calHome = null; calEvState = "loading"; loadCalEvents(false); }
    }
    if (calHome && calHome.key !== calHomeKey()) calHome = null; // 跨月：本月資料換新
    if (!calHome) { var n2 = new Date(); calLoad(n2.getFullYear(), n2.getMonth(), false); }
    renderCal();
    renderAgenda();
  }
  (function initCal() {
    var now = new Date();
    calView = { y: now.getFullYear(), m: now.getMonth() };
    calInited = true;
    calEvState = CAL_KEY ? "loading" : "off";
    calHomeState = CAL_KEY ? "loading" : "off";
    renderCal();
    renderAgenda();
    loadCalEvents(false);
    document.getElementById("mcPrev").addEventListener("click", function () { calGo(-1); });
    document.getElementById("mcNext").addEventListener("click", function () { calGo(1); });
    document.getElementById("mcMon").addEventListener("click", function () {
      if (!calFollow) { calGo(0); return; }
      var t = Date.now();
      if (t - calRefLast < 5000) return; // 已在本月：重新整理行程（5 秒防連點）
      calRefLast = t;
      loadCalEvents(true);
    });
    // 翻到其他月份後，滑鼠離開月曆 60 秒自動回到本月
    mcalEl.addEventListener("mouseleave", function () {
      if (calAwayT) clearTimeout(calAwayT);
      calAwayT = setTimeout(function () { if (!calFollow) calGo(0); }, 60000);
    });
    mcalEl.addEventListener("mouseenter", function () { if (calAwayT) { clearTimeout(calAwayT); calAwayT = null; } });
    setInterval(function () { loadCalEvents(false); }, 15 * 60 * 1000);
    setInterval(renderAgenda, 60 * 1000); // 每分鐘更新「已結束／進行中」狀態
  })();
  updateCalendarChips(); // 月相與農曆資料就緒後立即補顯示
  loadWeather();
  loadStock();
  loadTwQuotes(); loadOtcIdx(); loadAsia();
  loadGlobal(false);
  setInterval(function () {
    if (!wxManualLoc) wxLocKey = wxDefaultLoc(); // 未手動切換時，依上班時段自動回到預設地點
    loadWeather();
  }, 30 * 60 * 1000);
  setInterval(function () { loadStock(); loadTwQuotes(); loadOtcIdx(); loadAsia(); }, 10 * 60 * 1000);
  // 點一下台股膠囊立即更新（台股＋全球行情；5 秒內重複點擊不重抓）
  (function () {
    var twChip = document.getElementById("tw"), lastTap = 0;
    twChip.addEventListener("click", function () {
      var n2 = Date.now();
      if (n2 - lastTap < 5000) return;
      lastTap = n2;
      loadStock(); loadTwQuotes(); loadOtcIdx(); loadAsia(); loadGlobal(true);
    });
  })();
  setInterval(function () { loadGlobal(false); }, 30 * 60 * 1000);
  // ---- 新聞輪替列（中央社／BBC 中文／自由時報 官方 RSS）：即時、免金鑰；只留 36 小時內頭條，依 國際 > 財經 > 產業 優先排序 ----
  var NEWS_FEEDS = [
    ["國際", "https://feeds.feedburner.com/rsscna/intworld", "中央社"],
    ["國際", "https://feeds.bbci.co.uk/zhongwen/trad/rss.xml", "BBC中文"],
    ["國際", "https://news.ltn.com.tw/rss/world.xml", "自由時報"],
    ["國際", "https://cn.nytimes.com/rss/", "紐時中文"],
    ["國際", "https://crossing.cw.com.tw/rss", "換日線"],
    ["財經", "https://feeds.feedburner.com/rsscna/finance", "中央社"],
    ["財經", "https://news.ltn.com.tw/rss/business.xml", "自由時報"],
    ["產業", "https://feeds.feedburner.com/rsscna/technology", "中央社"],
    ["產業", "https://buzzorange.com/techorange/feed/", "TechOrange"],
    ["產業", "https://technews.tw/feed/", "科技新報"]
  ];
  var NEWS_ORDER = [["國際", 8], ["財經", 6], ["產業", 5]]; // 每類上限，同類單一來源最多 3 則，避免單家洗版
  var NEWS_TAGCLS = { "國際": "nt-intl", "財經": "nt-fin", "產業": "nt-tech" };
  var NEWS_SKIP = /廣編|贊助|優惠|折扣|抽獎|開獎|團購|好康|盤點概念股|同學會|樂透|今彩|威力彩|頭獎|發票|新聞360|自由說新聞|請見影片|書摘|推薦序/;
  var NEWS_LINKSKIP = /cn\.nytimes\.com\/(opinion|health|culture|travel|style|obits|realestate|education|dining|fashion|magazine)\//; // 紐時中文：略過評論與生活風格類
  var newsItems = [], newsIdx = 0, newsTimer = null, newsHover = false;
  function newsAgo(iso) {
    var t0 = new Date(iso).getTime();
    if (!isFinite(t0)) return "";
    var m = Math.max(1, Math.round((Date.now() - t0) / 60000));
    return m < 60 ? m + " 分鐘前" : m < 1440 ? Math.round(m / 60) + " 小時前" : Math.round(m / 1440) + " 天前";
  }
  function showNews(i, instant) {
    var it = newsItems[i];
    if (!it) return;
    var box = document.getElementById("newsItem");
    var apply = function () {
      var tagEl = document.getElementById("newsTag");
      tagEl.textContent = it.tag;
      tagEl.className = "news-tag " + (NEWS_TAGCLS[it.tag] || "");
      var a = document.getElementById("newsA");
      a.textContent = it.title;
      a.href = it.url;
      var ago = newsAgo(it.at);
      document.getElementById("newsSrc").textContent = it.src + (ago ? "・" + ago : "");
      box.classList.remove("fading");
    };
    if (instant) { apply(); return; }
    box.classList.add("fading");
    setTimeout(apply, 420);
  }
  function applyNews(items) {
    newsItems = items;
    newsIdx = 0;
    if (!items.length) return;
    document.getElementById("newsRow").hidden = false;
    showNews(0, true);
    startNewsTimer();
  }
  function startNewsTimer() {
    if (newsTimer) clearInterval(newsTimer);
    newsTimer = setInterval(function () {
      var row = document.getElementById("newsRow");
      if (row.classList.contains("off") || newsHover || newsItems.length < 2) return;
      newsIdx = (newsIdx + 1) % newsItems.length;
      showNews(newsIdx);
    }, 9000);
  }
  function newsStep(d) {
    if (!newsItems.length) return;
    newsIdx = (newsIdx + d + newsItems.length) % newsItems.length;
    showNews(newsIdx);
    startNewsTimer(); // 手動切換後重新計時，避免馬上又自動跳走
  }
  function fetchNewsFeed(u) {
    // 各家官方 RSS（不經 Google，避開代理遭擋）：即時、免金鑰；優先走 Worker 專線，不通時自動改走公用代理
    var routes = [
      function (x) { return WORKER_URL + "/?url=" + encodeURIComponent(x); },
      function (x) { return "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(x); }
    ];
    var i = 0;
    function next() {
      if (i >= routes.length) return Promise.reject(new Error("news unavailable"));
      var mk = routes[i++];
      return fetch(mk(u)).then(function (r) {
        if (!r.ok) throw new Error("news " + r.status);
        return r.text();
      }).then(function (tx) {
        if (tx.indexOf("<item>") < 0 && tx.indexOf("<entry") < 0) throw new Error("bad rss");
        return tx;
      }).catch(next);
    }
    return next();
  }
  // 解析 RSS：標題尾端「 - 來源」拆出來源名；只留 36 小時內、非廣宣的頭條
  function parseNewsRss(xml, tag, srcName) {
    var doc = new DOMParser().parseFromString(xml, "text/xml");
    var items = doc.getElementsByTagName("item");
    if (!items.length) items = doc.getElementsByTagName("entry"); // Atom 格式相容
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var el = items[i];
      var get = function (name) {
        var n = el.getElementsByTagName(name)[0];
        return n ? n.textContent : "";
      };
      var title = get("title"), link = get("link"), pub = get("pubDate") || get("published") || get("updated"), src = get("source") || srcName || "中央社";
      if (!link) { var ln0 = el.getElementsByTagName("link")[0]; link = ln0 ? (ln0.getAttribute("href") || "") : ""; }
      if (link.indexOf("cn.nytimes.com") >= 0) link = link.replace(/[?#].*$/, "").replace(/\/?$/, "/") + "zh-hant/"; // 紐時導向繁體版全文
      var desc = (get("description") || get("summary") || "").replace(/<[^>]+>/g, " ").replace(/\(www\.reuters\.com[\s\S]*$/, "").replace(/\s+/g, " ").trim();
      if (desc.length > 500) { // 盡量收在句號，避免斷在句中
        var cut0 = desc.slice(0, 500), p1 = Math.max(cut0.lastIndexOf("。"), cut0.lastIndexOf("！"), cut0.lastIndexOf("？"));
        desc = p1 > 100 ? cut0.slice(0, p1 + 1) : cut0 + "…";
      }
      if (desc && !/[一-鿿]/.test(desc)) desc = ""; // 純外文摘要無法直接閱讀，不彈卡
      var t0 = new Date(pub).getTime();
      if (!title || !isFinite(t0) || Date.now() - t0 > 36 * 60 * 60 * 1000) continue;
      if (NEWS_SKIP.test(title)) continue;
      if (!/[一-鿿]/.test(title)) continue; // 無中文標題（英文廣編等）不列入
      if (link && NEWS_LINKSKIP.test(link)) continue;
      var sfx = " - " + src;
      if (src && title.length > sfx.length && title.slice(-sfx.length) === sfx) title = title.slice(0, -sfx.length);
      out.push({ tag: tag, title: title, url: link || "#", src: src, at: pub, d: desc });
    }
    return out;
  }
  function loadNews() {
    try {
      var c = JSON.parse(localStorage.getItem("news24i") || "null");
      if (c && c.items && c.items.length && Date.now() - c.t < 25 * 60 * 1000) { applyNews(c.items); return; }
    } catch (e) {}
    Promise.all(NEWS_FEEDS.map(function (f) {
      return fetchNewsFeed(f[1]).then(function (xml) {
        return parseNewsRss(xml, f[0], f[2]);
      }).catch(function () { return []; });
    })).then(function (groups) {
      // 同類多來源合併後依時間新→舊排序，再依 國際 > 財經 > 產業 優先序串接；標題去重，單一來源每類最多 3 則
      var out = [], seen = {};
      for (var g = 0; g < NEWS_ORDER.length; g++) {
        var pool = [];
        for (var f2 = 0; f2 < NEWS_FEEDS.length; f2++) {
          if (NEWS_FEEDS[f2][0] === NEWS_ORDER[g][0]) pool = pool.concat(groups[f2]);
        }
        pool.sort(function (a, b) { return new Date(b.at).getTime() - new Date(a.at).getTime(); });
        var n = 0, perSrc = {};
        for (var i = 0; i < pool.length && n < NEWS_ORDER[g][1]; i++) {
          var a2 = pool[i];
          if (!a2.title || seen[a2.title]) continue;
          if ((perSrc[a2.src] || 0) >= 3) continue;
          perSrc[a2.src] = (perSrc[a2.src] || 0) + 1;
          seen[a2.title] = 1; out.push(a2); n++;
        }
      }
      if (!out.length) return;
      try { localStorage.setItem("news24i", JSON.stringify({ t: Date.now(), items: out })); } catch (e) {}
      applyNews(out);
    });
  }
  (function () {
    var row = document.getElementById("newsRow"), btn = document.getElementById("newsBtn");
    row.addEventListener("mouseenter", function () { newsHover = true; });
    row.addEventListener("mouseleave", function () { newsHover = false; });
    // 懸浮閱讀：滑鼠移到新聞標題上，浮出摘要卡直接閱讀（RSS 內文首段）
    var pop = document.getElementById("newsPop"), itemBox = document.getElementById("newsItem");
    function escHtml(t) { return String(t).replace(/[&<>"]/g, function (c) { return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : "&quot;"; }); }
    var popHideT = null;
    function popHide() { popHideT = setTimeout(function () { pop.hidden = true; newsHover = false; }, 200); }
    function popCancel() { if (popHideT) { clearTimeout(popHideT); popHideT = null; } }
    function popPlace() {
      // 固定錮定：嵌入框下緣緊貼新聞列，下方無空間可彈，改貼齊新聞列上方且不跟滑鼠移動
      var r = row.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
      pop.style.maxHeight = Math.max(80, Math.min(r.top - 10, vh - 16)) + "px"; // 嚴格限在嵌入框內
      pop.style.bottom = (vh - r.top + 2) + "px"; // 下緣貼近標題與鼠標
      pop.style.top = "auto";
      var a0 = document.getElementById("newsA").getBoundingClientRect();
      pop.style.left = Math.min(Math.max(8, a0.left - 10), Math.max(8, vw - pop.offsetWidth - 8)) + "px";
    }
    var linkEl = document.getElementById("newsA");
    linkEl.addEventListener("mouseenter", function () {   // 回應區只限標題文字，不再整條橫幅觸發
      var it = newsItems[newsIdx];
      if (!it || !it.d || it.d.length < 40) return;         // 摘要太短沒內容可讀，不彈卡
      popCancel();
      var ago = newsAgo(it.at);
      pop.innerHTML = escHtml(it.d) + '<a class="np-a" href="' + escHtml(it.url) + '" target="_blank" rel="noopener noreferrer">閱讀全文 ↗</a><span class="np-m">' + escHtml(it.src) + (ago ? "・" + ago : "") + '</span>';
      pop.hidden = false;
      popPlace();
    });
    linkEl.addEventListener("mouseleave", popHide);
    pop.addEventListener("mouseenter", function () { popCancel(); newsHover = true; }); // 滑進卡片繼續閱讀，輪替暫停
    pop.addEventListener("mouseleave", popHide);
    function setOn(on) {
      row.classList.toggle("off", !on);
      btn.classList.toggle("off", !on);
      btn.setAttribute("aria-label", on ? "隱藏新聞" : "顯示新聞");
      try { localStorage.setItem("newsOn24", on ? "1" : "0"); } catch (e) {}
    }
    btn.addEventListener("click", function () { setOn(row.classList.contains("off")); });
    document.getElementById("newsPrev").addEventListener("click", function () { newsStep(-1); });
    document.getElementById("newsNext").addEventListener("click", function () { newsStep(1); });
    var pref = "1";
    try { pref = localStorage.getItem("newsOn24") || "1"; } catch (e) {}
    setOn(pref !== "0");
  })();
  loadNews();
  setInterval(loadNews, 30 * 60 * 1000); // 每 30 分鐘更新一次（RSS 免額度，搭配快取保持新鮮）
})();
