<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<title>今日儀表板</title>
<style>
  :root {
    --text: #2C2C2B;
    --text2: #7D7A75;
    --seg-empty: #F0EFED;
    --dot-ring: rgba(0,0,0,0.18);
    /* 彩繪玻璃圓環（慕夏風）：鉛條、中心花窗、玻璃片色票（四季各 3 片深淺、日照分白天／晨昏／夜間） */
    --sg-lead: #4A3F37; --sg-frame: #A4783A; --sg-med: #FBF4E2; --sg-gold: #E9A93A; --sg-gloss0: 0.3; --sg-gloss1: 0.07;
    --sg-med-day: #FCF1D6; --sg-med-night: #3F4D8C; --sg-sun: #F0A92E; --sg-moon: #F6F2E2;
    --sg-sp1: #5DB36E; --sg-sp2: #3E9A57; --sg-sp3: #8DCB7B;
    --sg-su1: #EA846B; --sg-su2: #D8624E; --sg-su3: #F3A685;
    --sg-au1: #E8AF4C; --sg-au2: #CF8B2C; --sg-au3: #F2CA76;
    --sg-wi1: #5E93D6; --sg-wi2: #3F73BE; --sg-wi3: #88B1E7;
    /* 日照輪色階（依太陽高度）：午夜 nt-deep → 夜的邊緣 nt-edge → 深暮紫 tw（−12°）→ 晨昏玫瑰 dawn（0°）→ dy3（12°）→ dy1（28°）→ dy2（50°）→ dy4（78°） */
    --sg-dy1: #F2B33F; --sg-dy2: #F8D068; --sg-dy3: #E5962B; --sg-dy4: #FBE39C; --sg-dawn: #EC7A58;
    --sg-nt-edge: #5A5EB2; --sg-nt-deep: #352E78;
    --sg-tw: #7C6BC2; --sg-moonlit: #C6CEEE; --sg-moon-dark: #2B356A; /* 深暮紫、月光玻璃、月相暗面 */
    --sg-track: rgba(110,90,70,0.58);
    --mkt-closed: #EDEDEB;
    --ring-hand: #E25C2E; /* 日照輪、四季輪的寶石指針（同一色，飽和朱橘，繞在圈外） */
    --dot-blue: #A9CDEC;
    --dot-green: #A8D3B8;
    --dot-amber: #E9CF95;
    --dot-lav: #C9B8E4;
    --dot-rose: #E9BCC8;
    --dot-teal: #A8D3D1;
    --dot-indigo: #B3BBE6;
    --dot-peach: #F2C4A8;
    --dot-olive: #C9CC9C;
    --dot-mauve: #D4B5CF;
    --dot-slate: #B7C3CF;
    --dot-sand: #D3C7B4;
    --seg-fill-a: #BFD9F2;
    --seg-fill-b: #8FBBE8;
    --chip-bg: #EAF3FB;
    --chip-text: #5B8FC7;
    /* 星期燈：平日柿橘、週末灰玫瑰，亮燈皆實心白字、同尺寸 */
    --wd-on: #E8683C;
    --wd-on-wknd: #D37790;
    --wd-off-bg: #FCEFE5;
    --wd-off-text: #C68C66;
    --wd-off-bg-wknd: #FAEFF2;
    --wd-off-text-wknd: #D194A3;
    /* 休息日色（2026/10 改版，取代灰玫瑰）：週日＋國定假日＋補假＝珊瑚紅、週六＝鼠尾草綠；行程標記＝霧青 */
    --rest-sun: #ED6B5A;
    --rest-sun-bg: #FCEBE7;
    --ev-rgb: 236, 178, 72;   /* 行程底色（琥珀，與農曆膠囊同色系），透明度依筆數疊加 */
    --cal-out: #ABA8A2;       /* 月曆：其他月份的日期 */
    --nd-dot: #D3D0CA;        /* 切換圓點 */
    --nd-arrow: #7D7A75;      /* 切換圓點滑過時的箭頭 */
    --ag-ad-text: #9A6A1E;    /* 行程欄「全天」標籤字色 */
    --ag-today: #4A8FE7;      /* 行程欄「今天」：固定藍，不隨主題變色 */
    /* 年度天數標籤：扁平內斂 */
    --doy-text: #8C8983;
    /* 分區細線 */
    --divider: rgba(0,0,0,0.12);
  }

      --sg-dy1: #D5A043; --sg-dy2: #E2B657; --sg-dy3: #BE832D; --sg-dy4: #EBCB7A; --sg-dawn: #C9694C;
      --sg-nt-edge: #44478F; --sg-nt-deep: #24205A;
      --sg-tw: #61579F; --sg-moonlit: #93A1D6; --sg-moon-dark: #1C234F;
      --sg-track: rgba(235,215,185,0.5);

    :root[data-theme="sand"] {
      --seg-fill-a: rgba(196,184,166,0.45);

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 24px;
  }
  /* 版面：左欄＝主資訊（上）＋新聞列（下，右端止於時間區塊下方）；右欄＝月曆、主題色點，跨兩列 */
  .wrap {
    width: 100%;
    margin: auto 0; /* 上下置中；內容比嵌入框高時改為靠上，不會把第一行切掉 */
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto auto auto auto; /* 主資訊｜分隔線｜月份｜月曆格｜行程｜主題色 */
    column-gap: 12px;
    align-items: center;
  }
  .main {
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
  }
  /* ---- top line: date + day ring + time ---- */
  .line {
    display: flex;
    align-items: baseline;
    gap: 9px;
    flex-wrap: wrap;
  }
  .date {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  /* 星期標籤：與「第 N 天」同家族，平日柿橘、週末灰玫瑰 */
  .wd-chip {
    background: var(--wd-off-bg);
    color: var(--wd-on);
    border-radius: 4px;
    padding: 0 5px;
    line-height: 15px;
    font-size: 10.5px;
    font-weight: 500;
    align-self: center;
    white-space: nowrap;
  }
  .wd-chip.sun {
    background: var(--rest-sun-bg);
    color: var(--rest-sun);
  }
  .wd-chip.sat {
    background: var(--rest-sun-bg);
    color: var(--rest-sun);
  }
  body.ready .wd-chip { transition: background 0.3s ease, color 0.3s ease; }
  /* ---- 分區細線：左欄與月曆之間（縱貫兩列） ---- */
  .vdiv {
    grid-column: 2;
    grid-row: 1 / span 2;
    align-self: stretch;
    width: 1px;
    margin: 6px 0;
    border-radius: 0.5px;
    background: var(--divider);
  }
  /* ---- 月曆（整月六週、可切換月份；滑過日期看農曆／節日／行程，點一下開 Google 日曆） ---- */
  .mcal { display: contents; } /* 子元素直接排進外層格線：月份＋年（第 1 列）、切換灰點（第 2 列，與新聞列同高）、月曆格（跨兩列） */
  .mc-side {
    grid-column: 3;
    grid-row: 1;
    align-self: stretch;
    width: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 1px 0 0;
    user-select: none;
  }
  .mc-yr {
    font-size: 9px;
    font-weight: 600;
    line-height: 10px;
    color: var(--text2);
    font-variant-numeric: tabular-nums;
  }
  .mc-mon {
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    color: var(--text);
    font: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }
  .mc-mon b {
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .mc-mon i {
    font-style: normal;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text2);
    margin-top: 1px;
  }
  /* 切換鈕：兩顆同尺寸灰點（左＝上一個、右＝下一個），滑過時灰點收起、露出方向箭頭 */
  .navdots { display: inline-flex; align-items: center; gap: 1px; flex: none; }
  .nd { position: relative; flex: none; width: 13px; height: 13px; padding: 0; border: 0; background: none; cursor: pointer; }
  .nd::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: var(--nd-dot);
    transition: transform 0.18s ease, opacity 0.18s ease;
  }
  .nd::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 4px; height: 4px;
    border-top: 1.5px solid var(--nd-arrow); border-right: 1.5px solid var(--nd-arrow);
    opacity: 0; transition: opacity 0.18s ease;
  }
  .nd.prev::after { transform: translate(-30%, -50%) rotate(-135deg); }
  .nd.next::after { transform: translate(-75%, -50%) rotate(45deg); }
  .nd.down::after { transform: translate(-50%, -75%) rotate(135deg); }
  .nd:hover::before, .nd:focus-visible::before { transform: scale(0.2); opacity: 0; }
  .nd:hover::after, .nd:focus-visible::after { opacity: 1; }
  .nd:active::after { border-color: var(--text); }
  .nd:focus-visible { outline: none; }
  /* 月份切換灰點：放在第 2 列，盒模型與新聞列相同（上距 7、細線 1、內距 6），圓點中心自然同高 */
  .mc-nav {
    grid-column: 3;
    grid-row: 2;
    align-self: stretch;
    justify-self: center;
    gap: 0;
    margin-top: 7px;
    padding-top: 6px;
    border-top: 1px solid transparent;
  }
  .mc-grid {
    grid-column: 4;
    grid-row: 1 / span 2;
    align-self: stretch;
    min-height: 76px;
    margin-left: -5px; /* 與月份欄只隔 7px */
    display: grid;
    grid-template-columns: repeat(7, 18px);
    grid-template-rows: auto repeat(6, minmax(0, 1fr));
    column-gap: 2px;
    row-gap: 1px;
    align-items: stretch;
  }
  .mc-h {
    font-size: 9px;
    font-weight: 600;
    line-height: 1;
    padding-bottom: 2px;
    text-align: center;
    color: var(--text2);
    user-select: none;
  }
  .mc-h.rest { color: var(--rest-sun); }
  .mc-d {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 10px;
    border-radius: 4px;
    font-size: 9.5px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease;
  }
  .mc-d:hover { background: var(--seg-empty); }
  .mc-d:focus-visible { outline: none; box-shadow: 0 0 0 1px var(--text2); }
  .mc-d.rest { color: var(--rest-sun); }              /* 週六日、國定假日：統一珊瑚橘 */
  .mc-d.out, .mc-d.out.rest { color: var(--cal-out); } /* 其他月份：一律灰，不分平日假日 */
  /* 有行程：琥珀透明底，筆數越多疊得越深（--ea 由程式依筆數設定） */
  .mc-d.ev { background: rgba(var(--ev-rgb), var(--ea, 0.2)); }
  .mc-d.ev:hover { background: rgba(var(--ev-rgb), calc(var(--ea, 0.2) + 0.12)); }
  .mc-d.today, .mc-d.today.ev { background: var(--wd-on); color: #FFFFFF; }
  .mc-d.today.rest, .mc-d.today.rest.ev { background: var(--rest-sun); }
  /* ---- 今天／明天行程欄（月曆右側） ---- */
  .agenda {
    grid-column: 5;
    grid-row: 1 / span 2;
    align-self: start;
    width: 168px;
    display: flex;
    flex-direction: column;
    font-size: 11px;
    line-height: 15px;
  }
  .agenda[hidden] { display: none; }
  .wrap:has(.agenda[hidden]) { grid-template-columns: minmax(0, 1fr) auto auto auto auto; } /* 沒有行程欄時不留空欄位 */
  .wrap:has(.agenda[hidden]) .dots { grid-column: 5; }
  .ag-hd, .ag-it { height: 15px; min-width: 0; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .ag-hd { justify-content: space-between; }
  .ag-lab { font-size: 11px; font-weight: 650; color: var(--text); }
  .ag-lab.td { color: var(--ag-today); }
  .ag-cnt { font-size: 9.5px; color: var(--text2); opacity: 0.85; }
  .ag-tm { flex: none; font-size: 10px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .ag-tm.ad { font-size: 9px; line-height: 13px; padding: 0 4px; border-radius: 3px; background: rgba(var(--ev-rgb), 0.3); color: var(--ag-ad-text); }
  .ag-ti { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .ag-pill { flex: none; font-size: 9.5px; line-height: 13px; padding: 0 6px; border-radius: 4px; background: rgba(var(--ev-rgb), 0.3); color: var(--ag-ad-text); }
  .ag-plus { flex: none; margin-left: auto; font-size: 9px; line-height: 12px; padding: 0 4px; border-radius: 6px; background: var(--seg-empty); color: var(--text2); }
  .ag-it.past { opacity: 0.38; }
  .ag-it.now .ag-tm { color: var(--wd-on); font-weight: 650; }
  .agenda .gap { margin-top: 4px; } /* 今天與明天之間留一點呼吸 */
  .doy-chip.s-spring { background: rgba(120,180,130,0.18); color: #55875B; }
  .doy-chip.s-summer { background: rgba(226,132,110,0.18); color: #C2604F; }
  .doy-chip.s-autumn { background: rgba(226,178,96,0.2); color: #A9702B; }
  .doy-chip.s-winter { background: rgba(120,155,215,0.18); color: #5578A9; }
  .doy-chip.term { background: #F7E7CB; color: #A9702B; }
  .doy-chip {
    background: var(--seg-empty);
    color: var(--doy-text);
    border-radius: 4px;
    padding: 0 5px;
    line-height: 15px;
    font-size: 10.5px;
    font-weight: 500;
    align-self: center;
    white-space: nowrap;
  }
  /* ---- 天氣膠囊：與「第 N 天」同家族 ---- */
  .wx-chip {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: var(--chip-bg);
    border-radius: 4px;
    padding: 0 6px;
    line-height: 15px;
    font-size: 10.5px;
    font-weight: 500;
    align-self: center;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .wx-chip[hidden] { display: none; }
  #wx { cursor: pointer; }

  .etf-tris { display: inline-flex; align-items: center; gap: 2px; font-size: 8px; line-height: 15px; }
  .etf-tris[hidden] { display: none; }
  /* 階層色以台股指數漲跌色為基準（第2階＝#C1867D／#7FA98E 本色），向淺深兩端拉開 */
  .etf-tris .t-u1, #twChg.t-u1 { color: #DCB3AC; }
  .etf-tris .t-u2, #twChg.t-u2 { color: #C1867D; }
  .etf-tris .t-u3, #twChg.t-u3 { color: #A2584E; }
  .etf-tris .t-u4, #twChg.t-u4 { color: #7E2E24; }
  .etf-tris .t-d1, #twChg.t-d1 { color: #ABC8B6; }
  .etf-tris .t-d2, #twChg.t-d2 { color: #7FA98E; }
  .etf-tris .t-d3, #twChg.t-d3 { color: #578466; }
  .etf-tris .t-d4, #twChg.t-d4 { color: #305C41; }
  .etf-tris .t-f, #twChg.t-f { color: #B9B4AC; }
  #twChg { font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    /* 深色模式以「灰淡→鮮濃」表現深淺：幅度越大色彩越濃越醒目 */
    .etf-tris .t-u1, #twChg.t-u1 { color: #8F6D67; }
    .etf-tris .t-u2, #twChg.t-u2 { color: #B4867D; }
    .etf-tris .t-u3, #twChg.t-u3 { color: #D8A093; }
    .etf-tris .t-u4, #twChg.t-u4 { color: #F8BCA9; }
    .etf-tris .t-d1, #twChg.t-d1 { color: #6E8B7A; }
    .etf-tris .t-d2, #twChg.t-d2 { color: #8BAE97; }
    .etf-tris .t-d3, #twChg.t-d3 { color: #A8D2B6; }
    .etf-tris .t-d4, #twChg.t-d4 { color: #C5F5D5; }
    .etf-tris .t-f, #twChg.t-f { color: #6E6961; }
  }
  .wx-ic {
    font-size: 11px;
    line-height: 15px;
  }
  .wx-t { font-weight: 600; }
  .wx-item {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .wx-item[hidden] { display: none; } /* 休市時隱藏漲跌：連同空位一起收掉，膠囊右側不留白 */
  .wx-up { color: #C1867D; font-weight: 600; }
  .wx-down { color: #7FA98E; font-weight: 600; }
  .wx-flat { color: var(--text2); font-weight: 600; }
  .wx-lab { color: var(--text2); font-weight: 500; }
  #wx { cursor: pointer; }
  .moon-ic { font-size: 12px; line-height: 15px; align-self: center; user-select: none; }
  #tw.mkt-closed { background: var(--mkt-closed); }
  #tw.mkt-open-up { background: #F6E8E4; }
  #tw.mkt-open-down { background: #E7F0EA; }
  .wx-aqi-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9AA0A6;
    flex: 0 0 auto;
  }
  .time-group {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    align-self: center;
  }
  /* ---- 四季輪＋日照輪：慕夏彩繪玻璃風
     圓窗（.sg-body，縮成 68%）：古銅金外框 → 分片玻璃（深淺交錯）→ 內圈鉛條 → 中心花窗（四季＝四瓣花、日照＝太陽／夜間新月）
     圈外：點狀光環軌道＋寶石指針（沿軌道繞行）
     座標 0–40、0° 在正上方順時針；玻璃片由 JS 依節氣、日出日落產生 ---- */
  .main { --dock-ring: 48px; --dock-gap: 12px; --dock-w: calc(var(--dock-ring) * 2 + var(--dock-gap) + 20px); }
  .sgring { display: block; width: 26px; height: 26px; overflow: visible; margin: -1px 0; }
  .sg-pane { stroke: var(--sg-lead); stroke-width: 1.15; stroke-linejoin: round; }
  .sg-lead-o { fill: none; stroke: var(--sg-frame); stroke-width: 2.1; } /* 外框：慕夏光環的古銅金 */
  .sg-lead-i { fill: none; stroke: var(--sg-lead); stroke-width: 1.45; }
  .sg-med { fill: var(--sg-med); }
  .sg-petal { fill: var(--sg-petal, var(--sg-au3)); stroke: var(--sg-lead); stroke-width: 1; stroke-linejoin: round; }
  .sg-leaf { fill: var(--sg-gold); stroke: var(--sg-lead); stroke-width: 0.8; stroke-linejoin: round; }
  .sg-core { fill: var(--sg-gold); stroke: var(--sg-lead); stroke-width: 1; }
  .sg-track { fill: none; stroke: var(--sg-track); stroke-width: 1.25; stroke-linecap: round; stroke-dasharray: 0 2.7; } /* 圈外點狀軌道 */
  .sg-gloss .g0 { stop-color: #fff; stop-opacity: var(--sg-gloss0); }
  .sg-gloss .g1 { stop-color: #fff; stop-opacity: var(--sg-gloss1); }
  .sg-gloss .g2 { stop-color: #fff; stop-opacity: 0; }
  #sunring .sg-med { fill: var(--sg-med-day); }
  #sunring.night .sg-med { fill: var(--sg-med-night); }
  .sg-ray { fill: var(--sg-sun); stroke: var(--sg-lead); stroke-width: 0.8; stroke-linejoin: round; }
  #sunring.night .sg-ray { display: none; }
  #sunCore { fill: var(--sg-sun); }
  #moonLit, #moonRim { display: none; }
  #sunring.night #sunCore { fill: var(--sg-moon-dark); }
  #sunring.night #moonLit { display: inline; fill: var(--sg-moon); }
  #sunring.night #moonRim { display: inline; fill: none; stroke: var(--sg-lead); stroke-width: 1; } /* 中心月相：亮面＝實際月相，暗面淡淡看得到 */
  #sunHand, #seasonHand { fill: var(--ring-hand); stroke: var(--sg-lead); stroke-width: 0.8; } /* 寶石指針：兩個輪同色 */
  .sg-glint { fill: #fff; opacity: 0.8; pointer-events: none; }
  .time {
    font-size: 21px;
    font-weight: 650;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .time .sec {
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    font-variant-numeric: tabular-nums;
  }
  /* ---- segmented year progress ---- */
  .bar-row {
    margin-top: 9px;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .bar-label {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--text2);
    white-space: nowrap;
  }
  .segments {
    flex: 1 1 auto;
    display: flex;
    gap: 3px;
    height: 6px;
  }
  .seg {
    flex: 1 1 0;
    background: var(--seg-empty);
    border-radius: 3px;
    overflow: hidden;
  }
  .seg-inner {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: inherit;
  }
  body.ready .seg-inner { transition: width 0.8s ease; }
  .bar-pct {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--text2);
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }
  /* ---- theme dots (right edge) ---- */
  /* 主題色：單直行，一次顯示一組 3 色；最下方灰點切換下一組（共 4 組 12 色） */
  .dots {
    grid-column: 6;
    grid-row: 1 / span 2;
    align-self: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .dpage { display: none; flex-direction: column; gap: 3px; }
  .dpage.on { display: flex; }
  .dpage.on .dot::before { animation: dotIn 0.26s ease backwards; }
  .dpage.on .dot:nth-child(2)::before { animation-delay: 0.04s; }
  .dpage.on .dot:nth-child(3)::before { animation-delay: 0.08s; }
  @keyframes dotIn { from { transform: scale(0.3); opacity: 0; } }
  .dots .nd { width: 11px; height: 11px; }
  .dots .nd::before { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; }
  .dot {
    width: 11px;
    height: 11px;
    border: none;
    background: transparent;
    padding: 0;
    position: relative;
    cursor: pointer;
  }
  .dot::before {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: 50%;
    background: var(--c);
    opacity: 0.8;
    transition: opacity 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .dot:hover::before { opacity: 1; transform: scale(1.12); }
  .dot.active::before {
    opacity: 1;
    box-shadow: 0 0 0 2px var(--dot-ring);
  }
  .dot:focus-visible { outline: none; }
  .dot:focus-visible::before { box-shadow: 0 0 0 2px var(--dot-ring), 0 0 0 4px var(--chip-bg); }
  .dot-blue  { --c: var(--dot-blue); }
  .dot-green { --c: var(--dot-green); }
  .dot-amber { --c: var(--dot-amber); }
  .dot-lav   { --c: var(--dot-lav); }
  .dot-rose  { --c: var(--dot-rose); }
  .dot-teal  { --c: var(--dot-teal); }
  .dot-indigo { --c: var(--dot-indigo); }
  .dot-peach { --c: var(--dot-peach); }
  .dot-olive { --c: var(--dot-olive); }
  .dot-mauve { --c: var(--dot-mauve); }
  .dot-slate { --c: var(--dot-slate); }
  .dot-sand { --c: var(--dot-sand); }
  /* ---- 響應式排版 ---- */
  .lbrk { display: none; } /* 換行器：主欄夠寬時不顯示 */
  /* 依「主欄實際寬度」自動調整（不看視窗寬度，所以 Notion 頁面寬窄、有沒有行程欄都適用）：
     單行模式：寬度不夠時依序收起 0050 四小三角 → 台股漲跌點數 → ^TWII 字樣 → 天氣地點，保證時鐘不被擠到下一行
     兩行模式（主欄 ≤ 615px）：第一行日期＋週幾＋月相；第二行天氣＋台股（左）、圓環＋時鐘（右），再窄就依序收起次要資訊 */
  .main { container-type: inline-size; position: relative; }
  @container (min-width: 616px) and (max-width: 659px) { #etfTris { display: none !important; } }
  @container (min-width: 616px) and (max-width: 659px) { #twChg .tw-pts { display: none; } }
  /* 圓環展示區（主欄 ≥ 660px）：時鐘列與今年進度列往左收 128px，空出來的位置放大圓環（左＝日照輪緊鄰時鐘、右＝四季輪緊鄰月曆）
     新聞列與上方細線不受影響；圓環改為絕對定位、上下置中於兩列之間 */
  @container (min-width: 660px) {
    .line, .bar-row { margin-right: var(--dock-w); }
    .time-group .sgring { position: absolute; top: 50%; width: var(--dock-ring); height: var(--dock-ring); margin: calc(var(--dock-ring) / -2) 0 0; }
    #sunring { right: calc(var(--dock-ring) + var(--dock-gap) + 2px); }
    #seasonring { right: 2px; }
  }
  @container (min-width: 660px) and (max-width: 805px) { #etfTris { display: none !important; } }
  @container (min-width: 660px) and (max-width: 760px) { #twChg .tw-pts { display: none; } }
  @container (min-width: 660px) and (max-width: 728px) { #tw .wx-lab { display: none; } }
  @container (min-width: 660px) and (max-width: 698px) { #wx > .wx-item:first-child { display: none; } }
  @container (min-width: 616px) and (max-width: 659px) { #tw .wx-lab { display: none; } }
  @container (min-width: 616px) and (max-width: 638px) { #wx > .wx-item:first-child { display: none; } }
  @container (max-width: 615px) {
    .lbrk { display: block; order: 1; flex-basis: 100%; height: 0; }
    .wx-chip { order: 2; }
    .time-group { order: 3; margin-left: auto; }
  }
  @container (max-width: 530px) { #etfTris, #twChg .tw-pts { display: none !important; } }
  @container (max-width: 450px) { .wx-chip .wx-lab, #wx > .wx-item:first-child { display: none; } }
  @container (max-width: 390px) { .time .sec { display: none; } }
  @container (max-width: 325px) { #twChg { display: none !important; } }
  /* 行程欄：寬度不夠時先縮窄（標題自動截斷），再不夠就收起（滑過月曆日期仍看得到行程） */
  @media (max-width: 1119px) {
    .agenda { width: 122px; }
  }
  @media (max-width: 1059px) {
    .agenda { display: none; }
    .wrap { grid-template-columns: minmax(0, 1fr) auto auto auto auto; } /* 收起後不留空欄位與間距 */
    .dots { grid-column: 5; }
  }
  /* 中寬（約 761–960px）：月曆與間距稍微收緊，避免時鐘被擠到第二行 */
  @media (max-width: 960px) {
    body { padding: 8px 16px; }
    .wrap { column-gap: 9px; }
    .mc-grid { grid-template-columns: repeat(7, 16px); column-gap: 1px; margin-left: -4px; }
  }
  /* 中幅（窄視窗／平板）：先收掉右側月曆 */
  @media (max-width: 840px) { /* 840 以下主欄會窄到要換兩行，先收月曆，保持單行＋月曆或兩行無月曆兩種乾淨組合 */
    .mcal, .vdiv { display: none; }
    .wrap, .wrap:has(.agenda[hidden]) { grid-template-columns: minmax(0, 1fr) auto; }
    .wrap .dots, .wrap:has(.agenda[hidden]) .dots { grid-column: 2; }
  }
  /* 手機版：固定三行，每行內容都留足餘裕，不會因字型或寬度差異換行
     第一行：日期＋週幾＋月相（右上角留給 Notion 手機版的浮動選單）
     第二行：天氣膠囊＋台股膠囊（左）、四季輪＋日照輪＋時鐘（右）
     第三行：今年進度列
     隱藏：秒數、月曆、行程、主題色點、第 N 天／農曆膠囊；嵌入框高度不到 150px 時連新聞列一起收起 */
  @media (max-width: 520px) {
    body { padding: 6px 14px; }
    .wrap, .wrap:has(.agenda[hidden]) { grid-template-columns: minmax(0, 1fr); }
    .line { row-gap: 7px; column-gap: 8px; align-items: center; }
    #wx > .wx-item:first-child { display: none; } /* 地點標籤已隱藏，連同空位一起收掉 */
    .time-group { gap: 6px; }
    .sgring { width: 24px; height: 24px; }
    .time { font-size: 19px; }
    .time .sec { display: none; }
    .dots { display: none; }
    .doy-chip { display: none; }
    .wx-chip .wx-lab { display: none; }
    .bar-row { margin-top: 7px; }
    .segments { gap: 2px; }
  }
  @media (max-width: 520px) and (max-height: 149px) {
    .news-row, .news-toggle { display: none !important; }
  }
  /* ---- 新聞輪替列（各家官方 RSS）：一次一則、淡入淡出輪替，可收合 ---- */
  .news-row { position: relative; grid-column: 1; grid-row: 2; min-width: 0; display: flex; align-items: center; gap: 7px; margin: 7px 0 0 4px; padding-top: 6px; border-top: 1px solid rgba(0,0,0,0.07); font-size: 12px; line-height: 17px; min-height: 18px; }
  .news-row[hidden] { display: none; }
  .news-tag { flex: none; font-size: 10px; line-height: 15px; padding: 0 7px; border-radius: 8px; background: #EFE9DF; color: #8A7A62; font-weight: 600; letter-spacing: 1px; }
  .news-tag.nt-intl { background: #EAF3FB; color: #5B8FC7; }
  .news-tag.nt-fin { background: #FAF2DF; color: #A98938; }
  .news-tag.nt-tech { background: #E9F5F4; color: #4E9C99; }
  .news-tag.nt-op { background: #F2EDFA; color: #8371B8; }
  .news-item { flex: 1 1 auto; min-width: 0; display: inline-flex; justify-content: flex-start; text-align: left; align-items: baseline; gap: 7px; opacity: 1; transform: translateY(0); transition: opacity .4s ease, transform .4s ease; }
  .news-item.fading { opacity: 0; transform: translateY(3px); }
  .news-a { min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: inherit; opacity: .85; text-decoration: none; font-weight: 500; }
  .news-a:hover { opacity: 1; text-decoration: underline; }
  .news-src { flex: none; color: var(--text2); opacity: .75; font-size: 10.5px; }
  .news-btn { flex: none; border: 0; background: none; cursor: pointer; padding: 0 2px; color: var(--text2); font-size: 10px; line-height: 16px; opacity: .35; }
  .news-btn:hover { opacity: 1; }
  .news-row.off { display: none; }
  .news-toggle { border: 0; background: none; cursor: pointer; padding: 0 2px; font-size: 12px; line-height: 15px; align-self: center; opacity: .9; transition: opacity .25s ease, filter .25s ease; }
  .news-toggle.off { opacity: .3; filter: grayscale(1); }
  .news-pop { box-sizing: border-box; position: fixed; z-index: 30; width: min(560px, calc(100vw - 20px)); max-height: calc(100vh - 14px); overflow-y: auto; background: #FFFEFB; border: 1px solid rgba(0,0,0,0.08); border-radius: 10px; box-shadow: 0 8px 26px rgba(0,0,0,0.12); padding: 10px 13px; font-size: 12px; line-height: 1.7; color: inherit; }
  .news-pop[hidden] { display: none; }
  .news-pop .np-t { display: block; font-weight: 600; margin-bottom: 3px; }
  .news-pop .np-m { display: block; margin-top: 5px; font-size: 10.5px; color: var(--text2); opacity: .85; }
  .news-pop .np-a { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 600; color: #5B8FC7; text-decoration: none; }
  .news-pop .np-a:hover { text-decoration: underline; }
  #tw { cursor: pointer; }
  @media (prefers-color-scheme: dark) {
    .news-row { border-top-color: rgba(255,255,255,0.09); }
    .news-tag { background: rgba(255,255,255,0.08); color: #B9AB94; }
    .news-tag.nt-intl { background: rgba(94,159,232,0.14); color: #8FB8E8; }
    .news-tag.nt-fin { background: rgba(224,190,114,0.14); color: #DCC183; }
    .news-tag.nt-tech { background: rgba(78,156,153,0.16); color: #7FC4C1; }
    .news-tag.nt-op { background: rgba(150,130,220,0.16); color: #B4A5E0; }
    .news-pop { background: #33322E; border-color: rgba(255,255,255,0.12); box-shadow: 0 8px 26px rgba(0,0,0,0.5); }
    .news-pop .np-a { color: #8FB8E8; }
  }
  @media (max-width: 520px) { .news-src { display: none; } .news-row { margin: 4px 0 0 4px; padding-top: 4px; } }
</style>

<body>
  <div class="wrap">
    <div class="main">
      <div class="line">
        <span class="date" id="date">—</span>
        <span class="wd-chip" id="wdchip" role="img" aria-label="星期">—</span>
        <span class="moon-ic" id="moon" role="img" aria-label="月相" hidden>—</span>
        <span class="wx-chip" id="wx" hidden role="img" aria-label="台中即時天氣">
          <span class="wx-item"><span class="wx-lab" id="wxLoc">—</span></span>
          <span class="wx-item"><span class="wx-ic" id="wxIcon">—</span><span class="wx-t" id="wxTemp">--°</span></span>
          <span class="wx-item"><span class="wx-lab">☔</span><span id="wxRain">--%</span></span>
          <span class="wx-item"><span class="wx-aqi-dot" id="wxAqiDot" aria-hidden="true"></span><span id="wxAqi">--</span></span>

        var w = we.Weather && String(we.Weather).indexOf("-99") < 0 ? String(we.Weather) : "";

  // ---- 台股加權指數（盤中延遲報價，失敗時退回證交所 OpenAPI 收盤資料） ----

  function loadStock() {

      .then(function (j) {

  // ---- 台股 ETF／台積電（顯示於台股懸浮資訊；富果為主、證交所批次備援） ----

  var TRI_CODES = ["0050", "OTC", "0052", "0055", "0056"];

  var twTriPcts = {};

  function applyTwQuotes(parts) {

  function loadTwQuotes() {
    var jobs = TW_QUOTES.map(function (it) {

  }, 30 * 60 * 1000);
  setInterval(function () { loadStock(); loadTwQuotes(); loadOtcIdx(); loadAsia(); }, 10 * 60 * 1000);
  // 點一下台股膠囊立即更新（台股＋全球行情；5 秒內重複點擊不重抓）
  (function () {
    var twChip = document.getElementById("tw"), lastTap = 0;
    twChip.addEventListener("click", function () {
      var n2 = Date.now();
      if (n2 - lastTap < 5000) return;
      lastTap = n2;
      loadStock(); loadTwQuotes(); loadOtcIdx(); loadAsia(); loadGlobal(true);
    });
  })();
  setInterval(function () { loadGlobal(false); }, 30 * 60 * 1000);
  // ---- 新聞輪替列（中央社／BBC 中文／自由時報 官方 RSS）：即時、免金鑰；只留 36 小時內頭條，依 國際 > 財經 > 產業 優先排序 ----
  var NEWS_FEEDS = [
    ["國際", "https://feeds.feedburner.com/rsscna/intworld", "中央社"],
    ["國際", "https://feeds.bbci.co.uk/zhongwen/trad/rss.xml", "BBC中文"],
    ["國際", "https://news.ltn.com.tw/rss/world.xml", "自由時報"],
    ["國際", "https://cn.nytimes.com/rss/", "紐時中文"],
    ["國際", "https://crossing.cw.com.tw/rss", "換日線"],
    ["財經", "https://feeds.feedburner.com/rsscna/finance", "中央社"],
    ["財經", "https://news.ltn.com.tw/rss/business.xml", "自由時報"],
    ["產業", "https://feeds.feedburner.com/rsscna/technology", "中央社"],
    ["產業", "https://buzzorange.com/techorange/feed/", "TechOrange"],
    ["產業", "https://technews.tw/feed/", "科技新報"]
  ];
  var NEWS_ORDER = [["國際", 8], ["財經", 6], ["產業", 5]]; // 每類上限，同類單一來源最多 3 則，避免單家洗版
  var NEWS_TAGCLS = { "國際": "nt-intl", "財經": "nt-fin", "產業": "nt-tech" };
  var NEWS_SKIP = /廣編|贊助|優惠|折扣|抽獎|開獎|團購|好康|盤點概念股|同學會|樂透|今彩|威力彩|頭獎|發票|新聞360|自由說新聞|請見影片|書摘|推薦序/;
  var NEWS_LINKSKIP = /cn\.nytimes\.com\/(opinion|health|culture|travel|style|obits|realestate|education|dining|fashion|magazine)\//; // 紐時中文：略過評論與生活風格類
  var newsItems = [], newsIdx = 0, newsTimer = null, newsHover = false;
  function newsAgo(iso) {
    var t0 = new Date(iso).getTime();
    if (!isFinite(t0)) return "";
    var m = Math.max(1, Math.round((Date.now() - t0) / 60000));
    return m < 60 ? m + " 分鐘前" : m < 1440 ? Math.round(m / 60) + " 小時前" : Math.round(m / 1440) + " 天前";
  }
  function showNews(i, instant) {
    var it = newsItems[i];
    if (!it) return;
    var box = document.getElementById("newsItem");
    var apply = function () {
      var tagEl = document.getElementById("newsTag");
      tagEl.textContent = it.tag;
      tagEl.className = "news-tag " + (NEWS_TAGCLS[it.tag] || "");
      var a = document.getElementById("newsA");
      a.textContent = it.title;
      a.href = it.url;
      var ago = newsAgo(it.at);
      document.getElementById("newsSrc").textContent = it.src + (ago ? "・" + ago : "");
      box.classList.remove("fading");
    };
    if (instant) { apply(); return; }
    box.classList.add("fading");
    setTimeout(apply, 420);
  }
  function applyNews(items) {
    newsItems = items;
    newsIdx = 0;
    if (!items.length) return;
    document.getElementById("newsRow").hidden = false;
    showNews(0, true);
    startNewsTimer();
  }
  function startNewsTimer() {
    if (newsTimer) clearInterval(newsTimer);
    newsTimer = setInterval(function () {
      var row = document.getElementById("newsRow");
      if (row.classList.contains("off") || newsHover || newsItems.length < 2) return;
      newsIdx = (newsIdx + 1) % newsItems.length;
      showNews(newsIdx);
    }, 9000);
  }
  function newsStep(d) {
    if (!newsItems.length) return;
    newsIdx = (newsIdx + d + newsItems.length) % newsItems.length;
    showNews(newsIdx);
    startNewsTimer(); // 手動切換後重新計時，避免馬上又自動跳走
  }
  function fetchNewsFeed(u) {
    // 各家官方 RSS（不經 Google，避開代理遭擋）：即時、免金鑰；優先走 Worker 專線，不通時自動改走公用代理
    var routes = [
      function (x) { return WORKER_URL + "/?url=" + encodeURIComponent(x); },
      function (x) { return "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(x); }
    ];
    var i = 0;
    function next() {
      if (i >= routes.length) return Promise.reject(new Error("news unavailable"));
      var mk = routes[i++];
      return fetch(mk(u)).then(function (r) {
        if (!r.ok) throw new Error("news " + r.status);
        return r.text();
      }).then(function (tx) {
        if (tx.indexOf("<item>") < 0 && tx.indexOf("<entry") < 0) throw new Error("bad rss");
        return tx;
      }).catch(next);
    }
    return next();
  }
  // 解析 RSS：標題尾端「 - 來源」拆出來源名；只留 36 小時內、非廣宣的頭條
  function parseNewsRss(xml, tag, srcName) {
    var doc = new DOMParser().parseFromString(xml, "text/xml");
    var items = doc.getElementsByTagName("item");
    if (!items.length) items = doc.getElementsByTagName("entry"); // Atom 格式相容
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var el = items[i];
      var get = function (name) {
        var n = el.getElementsByTagName(name)[0];
        return n ? n.textContent : "";
      };
      var title = get("title"), link = get("link"), pub = get("pubDate") || get("published") || get("updated"), src = get("source") || srcName || "中央社";
      if (!link) { var ln0 = el.getElementsByTagName("link")[0]; link = ln0 ? (ln0.getAttribute("href") || "") : ""; }
      if (link.indexOf("cn.nytimes.com") >= 0) link = link.replace(/[?#].*$/, "").replace(/\/?$/, "/") + "zh-hant/"; // 紐時導向繁體版全文
      var desc = (get("description") || get("summary") || "").replace(/<[^>]+>/g, " ").replace(/\(www\.reuters\.com[\s\S]*$/, "").replace(/\s+/g, " ").trim();
      if (desc.length > 500) { // 盡量收在句號，避免斷在句中
        var cut0 = desc.slice(0, 500), p1 = Math.max(cut0.lastIndexOf("。"), cut0.lastIndexOf("！"), cut0.lastIndexOf("？"));
        desc = p1 > 100 ? cut0.slice(0, p1 + 1) : cut0 + "…";
      }
      if (desc && !/[一-鿿]/.test(desc)) desc = ""; // 純外文摘要無法直接閱讀，不彈卡
      var t0 = new Date(pub).getTime();
      if (!title || !isFinite(t0) || Date.now() - t0 > 36 * 60 * 60 * 1000) continue;
      if (NEWS_SKIP.test(title)) continue;
      if (!/[一-鿿]/.test(title)) continue; // 無中文標題（英文廣編等）不列入
      if (link && NEWS_LINKSKIP.test(link)) continue;
      var sfx = " - " + src;
      if (src && title.length > sfx.length && title.slice(-sfx.length) === sfx) title = title.slice(0, -sfx.length);
      out.push({ tag: tag, title: title, url: link || "#", src: src, at: pub, d: desc });
    }
    return out;
  }
  function loadNews() {
    try {
      var c = JSON.parse(localStorage.getItem("news24i") || "null");
      if (c && c.items && c.items.length && Date.now() - c.t < 25 * 60 * 1000) { applyNews(c.items); return; }
    } catch (e) {}
    Promise.all(NEWS_FEEDS.map(function (f) {
      return fetchNewsFeed(f[1]).then(function (xml) {
        return parseNewsRss(xml, f[0], f[2]);
      }).catch(function () { return []; });
    })).then(function (groups) {
      // 同類多來源合併後依時間新→舊排序，再依 國際 > 財經 > 產業 優先序串接；標題去重，單一來源每類最多 3 則
      var out = [], seen = {};
      for (var g = 0; g < NEWS_ORDER.length; g++) {
        var pool = [];
        for (var f2 = 0; f2 < NEWS_FEEDS.length; f2++) {
          if (NEWS_FEEDS[f2][0] === NEWS_ORDER[g][0]) pool = pool.concat(groups[f2]);
        }
        pool.sort(function (a, b) { return new Date(b.at).getTime() - new Date(a.at).getTime(); });
        var n = 0, perSrc = {};
        for (var i = 0; i < pool.length && n < NEWS_ORDER[g][1]; i++) {
          var a2 = pool[i];
          if (!a2.title || seen[a2.title]) continue;
          if ((perSrc[a2.src] || 0) >= 3) continue;
          perSrc[a2.src] = (perSrc[a2.src] || 0) + 1;
          seen[a2.title] = 1; out.push(a2); n++;
        }
      }
      if (!out.length) return;
      try { localStorage.setItem("news24i", JSON.stringify({ t: Date.now(), items: out })); } catch (e) {}
      applyNews(out);
    });
  }
  (function () {
    var row = document.getElementById("newsRow"), btn = document.getElementById("newsBtn");
    row.addEventListener("mouseenter", function () { newsHover = true; });
    row.addEventListener("mouseleave", function () { newsHover = false; });
    // 懸浮閱讀：滑鼠移到新聞標題上，浮出摘要卡直接閱讀（RSS 內文首段）
    var pop = document.getElementById("newsPop"), itemBox = document.getElementById("newsItem");
    function escHtml(t) { return String(t).replace(/[&<>"]/g, function (c) { return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : "&quot;"; }); }
    var popHideT = null;
    function popHide() { popHideT = setTimeout(function () { pop.hidden = true; newsHover = false; }, 200); }
    function popCancel() { if (popHideT) { clearTimeout(popHideT); popHideT = null; } }
    function popPlace() {
      // 固定錮定：嵌入框下緣緊貼新聞列，下方無空間可彈，改貼齊新聞列上方且不跟滑鼠移動
      var r = row.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
      pop.style.maxHeight = Math.max(80, Math.min(r.top - 10, vh - 16)) + "px"; // 嚴格限在嵌入框內
      pop.style.bottom = (vh - r.top + 2) + "px"; // 下緣貼近標題與鼠標
      pop.style.top = "auto";
      var a0 = document.getElementById("newsA").getBoundingClientRect();
      pop.style.left = Math.min(Math.max(8, a0.left - 10), Math.max(8, vw - pop.offsetWidth - 8)) + "px";
    }
    var linkEl = document.getElementById("newsA");
    linkEl.addEventListener("mouseenter", function () {   // 回應區只限標題文字，不再整條橫幅觸發
      var it = newsItems[newsIdx];
      if (!it || !it.d || it.d.length < 40) return;         // 摘要太短沒內容可讀，不彈卡
      popCancel();
      var ago = newsAgo(it.at);
      pop.innerHTML = escHtml(it.d) + '<a class="np-a" href="' + escHtml(it.url) + '" target="_blank" rel="noopener noreferrer">閱讀全文 ↗</a><span class="np-m">' + escHtml(it.src) + (ago ? "・" + ago : "") + '</span>';
      pop.hidden = false;
      popPlace();
    });
    linkEl.addEventListener("mouseleave", popHide);
    pop.addEventListener("mouseenter", function () { popCancel(); newsHover = true; }); // 滑進卡片繼續閱讀，輪替暫停
    pop.addEventListener("mouseleave", popHide);
    function setOn(on) {
      row.classList.toggle("off", !on);
      btn.classList.toggle("off", !on);
      btn.setAttribute("aria-label", on ? "隱藏新聞" : "顯示新聞");
      try { localStorage.setItem("newsOn24", on ? "1" : "0"); } catch (e) {}
    }
    btn.addEventListener("click", function () { setOn(row.classList.contains("off")); });
    document.getElementById("newsPrev").addEventListener("click", function () { newsStep(-1); });
    document.getElementById("newsNext").addEventListener("click", function () { newsStep(1); });
    var pref = "1";
    try { pref = localStorage.getItem("newsOn24") || "1"; } catch (e) {}
    setOn(pref !== "0");
  })();
  loadNews();
  setInterval(loadNews, 30 * 60 * 1000); // 每 30 分鐘更新一次（RSS 免額度，搭配快取保持新鮮）
})();
</script>
